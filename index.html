<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teaching Planner</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#172033}
header{background:#fff;border-bottom:1px solid #e4e8f0;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
h1{font-size:22px;margin:0}.sub{color:#6b7280;font-size:13px;margin-top:3px}
nav{display:flex;gap:8px;flex-wrap:wrap}.navbtn{border:0;background:#eef2f7;padding:9px 13px;border-radius:9px;cursor:pointer;font-weight:600}.navbtn.active{background:#172033;color:white}
main{max-width:1200px;margin:auto;padding:24px}.page{display:none}.page.active{display:block}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.card{background:#fff;border:1px solid #e5e9f0;border-radius:14px;padding:17px}.label{font-size:12px;color:#6b7280}.value{font-size:27px;font-weight:750;margin-top:5px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.toolbar input,.toolbar select,.toolbar button,input,select{padding:9px 10px;border:1px solid #d8dee8;border-radius:8px;background:white}
button{cursor:pointer}.primary{background:#172033;color:white;border:0;padding:10px 14px;border-radius:9px;font-weight:650}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e5e9f0;border-radius:12px;overflow:hidden}th,td{padding:11px 12px;border-bottom:1px solid #edf0f4;text-align:left;font-size:14px}th{background:#f8fafc;font-size:12px;color:#657084}tr:last-child td{border-bottom:0}
.badge{padding:4px 8px;border-radius:20px;font-size:12px;font-weight:650}.done{background:#dcfce7;color:#166534}.pending{background:#fff7ed;color:#9a3412}.paid{background:#dcfce7;color:#166534}.unpaid{background:#fee2e2;color:#991b1b}
.check{width:18px;height:18px}.actions button{margin-right:5px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{background:#fff;border:1px solid #e5e9f0;border-radius:12px;min-height:150px;padding:10px}.day h3{font-size:13px;margin:0 0 8px}.lesson{font-size:12px;border-left:3px solid #64748b;background:#f8fafc;padding:7px;margin:6px 0;border-radius:5px}.lesson.donebox{opacity:.55}.lesson strong{display:block}
.form{background:#fff;border:1px solid #e5e9f0;border-radius:14px;padding:18px;margin-bottom:16px}.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.form label{font-size:12px;color:#657084;display:block;margin-bottom:5px}.form input,.form select{width:100%}
.empty{padding:35px;text-align:center;color:#6b7280;background:#fff;border:1px dashed #d7dce5;border-radius:12px}
@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.formgrid{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.day{min-height:auto}}
@media(max-width:500px){main{padding:14px}.cards{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}header{padding:14px}.value{font-size:22px}}
</style>
</head>
<body>
<header>
<div><h1>Teaching Planner</h1><div class="sub">Lessons · attendance · payments · income</div></div>
<nav>
<button class="navbtn active" onclick="show('dashboard',this)">Dashboard</button>
<button class="navbtn" onclick="show('calendar',this)">Calendar</button>
<button class="navbtn" onclick="show('students',this)">Students</button>
<button class="navbtn" onclick="show('lessons',this)">Lessons</button>
</nav>
</header>
<main>
<section id="dashboard" class="page active">
<h2>Dashboard</h2>
<div class="cards">
<div class="card"><div class="label">This month's completed income</div><div class="value" id="income">€0</div></div>
<div class="card"><div class="label">Unpaid</div><div class="value" id="unpaid">€0</div></div>
<div class="card"><div class="label">Lessons completed</div><div class="value" id="completed">0</div></div>
<div class="card"><div class="label">Teaching hours</div><div class="value" id="hours">0h</div></div>
</div>
<div class="toolbar"><button class="primary" onclick="generateWeek()">Generate this week's recurring lessons</button><button onclick="exportCSV()">Export CSV</button></div>
<div id="dashTable"></div>
</section>

<section id="calendar" class="page">
<h2>Calendar</h2>
<div class="toolbar"><button onclick="moveWeek(-1)">← Previous</button><strong id="weekTitle"></strong><button onclick="moveWeek(1)">Next →</button></div>
<div class="grid" id="calendarGrid"></div>
</section>

<section id="students" class="page">
<h2>Students</h2>
<div class="form">
<div class="formgrid">
<div><label>Name</label><input id="sName" placeholder="e.g. Trung"></div>
<div><label>Subject</label><input id="sSubject" placeholder="Math"></div>
<div><label>Price (€)</label><input id="sPrice" type="number" step=".01" placeholder="8"></div>
<div><label>Duration (minutes)</label><input id="sDuration" type="number" placeholder="60"></div>
</div>
<div style="margin-top:12px"><label>Recurring days</label>
<div id="days"></div></div>
<button class="primary" style="margin-top:14px" onclick="addStudent()">Add student</button>
</div>
<div id="studentTable"></div>
</section>

<section id="lessons" class="page">
<h2>Lessons</h2>
<div class="toolbar"><input type="date" id="filterDate" onchange="renderLessons()"><select id="filterStudent" onchange="renderLessons()"><option value="">All students</option></select><button onclick="clearFilters()">Clear</button></div>
<div id="lessonTable"></div>
</section>
</main>
<script>
const KEY='teachingPlannerV1';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
students:[
{name:'Trung',subject:'Math',price:8,duration:60,days:[2,6]},
{name:'Jesica',subject:'Math',price:7,duration:40,days:[2]},
{name:'Brians/Adaline',subject:'Latvian',price:18,duration:90,days:[3,5,0]},
{name:'Hiep',subject:'Latvian',price:15,duration:90,days:[4,6]},
{name:'Anna',subject:'Latvian',price:11,duration:90,days:[5,0]},
{name:'Vy',subject:'Math',price:9,duration:60,days:[6]},
{name:'An',subject:'Latvian',price:5,duration:60,days:[6,0]},
{name:'Hieu',subject:'Latvian',price:10,duration:90,days:[0]},
{name:'Tuong',subject:'Latvian',price:5,duration:40,days:[1,3]},
{name:'Quan + Thu',subject:'English',price:11,duration:60,days:[1,5]}
],lessons:[]};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function money(x){return '€'+Number(x).toFixed(2).replace('.00','')}
function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function dateObj(s){return new Date(s+'T12:00:00')}
function show(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');renderAll()}
function addStudent(){
let days=[...document.querySelectorAll('#days input:checked')].map(x=>+x.value);
let n=sName.value.trim(), sub=sSubject.value.trim(), p=+sPrice.value, dur=+sDuration.value;
if(!n||!sub||!p||!dur||!days.length)return alert('Fill all fields and choose at least one recurring day.');
state.students.push({name:n,subject:sub,price:p,duration:dur,days});save();sName.value=sSubject.value=sPrice.value=sDuration.value='';document.querySelectorAll('#days input').forEach(x=>x.checked=false);renderAll()
}
function deleteStudent(i){if(confirm('Delete this student?')){state.students.splice(i,1);save();renderAll()}}
function generateWeek(){
let start=new Date();start.setDate(start.getDate()-start.getDay()+1);
for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+i);let date=iso(d);
state.students.forEach((s,si)=>{let day=d.getDay();if(s.days.includes(day)&&!state.lessons.some(l=>l.date===date&&l.student===s.name)){
let times={}; // current known schedule
let slots={
'Trung':{2:'19:00',6:'15:00'},'Jesica':{2:'20:20',6:'12:00',0:'12:00'},
'Brians/Adaline':{3:'19:00',5:'19:00',0:'18:00'},'Hiep':{4:'19:30',6:'19:30'},
'Anna':{5:'17:30',0:'16:00'},'Vy':{6:'11:00'},'An':{6:'14:00',0:'14:00'},
'Hieu':{0:'09:00'},'Tuong':{1:'19:15',3:'17:10'},'Quan + Thu':{1:'20:00',5:'16:15'}
};
state.lessons.push({date,student:s.name,subject:s.subject,time:(slots[s.name]||{})[day]||'--:--',duration:s.duration,price:s.price,done:false,paid:false});
}})}
save();renderAll();alert('This week generated.')}
function renderStudents(){
let html='<table><tr><th>Student</th><th>Subject</th><th>Price</th><th>Duration</th><th>Days</th><th></th></tr>';
state.students.forEach((s,i)=>html+=`<tr><td><strong>${s.name}</strong></td><td>${s.subject}</td><td>${money(s.price)}</td><td>${s.duration} min</td><td>${s.days.map(x=>dow[x]).join(', ')}</td><td><button onclick="deleteStudent(${i})">Delete</button></td></tr>`);
studentTable.innerHTML=html+'</table>';
}
function renderLessons(){
let arr=[...state.lessons].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
let fd=filterDate.value, fs=filterStudent.value;if(fd)arr=arr.filter(l=>l.date===fd);if(fs)arr=arr.filter(l=>l.student===fs);
if(!arr.length)return lessonTable.innerHTML='<div class="empty">No lessons yet. Generate this week from the Dashboard.</div>';
let html='<table><tr><th>Date</th><th>Time</th><th>Student</th><th>Subject</th><th>Fee</th><th>Done</th><th>Paid</th></tr>';
arr.forEach((l,i)=>{let idx=state.lessons.indexOf(l);html+=`<tr><td>${l.date}</td><td>${l.time}</td><td>${l.student}</td><td>${l.subject}</td><td>${money(l.price)}</td><td><input class="check" type="checkbox" ${l.done?'checked':''} onchange="toggle(${idx},'done',this.checked)"></td><td><input class="check" type="checkbox" ${l.paid?'checked':''} onchange="toggle(${idx},'paid',this.checked)"></td></tr>`});
lessonTable.innerHTML=html+'</table>';
}
function toggle(i,k,v){state.lessons[i][k]=v;save();renderAll()}
function clearFilters(){filterDate.value='';filterStudent.value='';renderLessons()}
function renderDash(){
let now=new Date(), ym=iso(now).slice(0,7), arr=state.lessons.filter(l=>l.date.startsWith(ym));
let done=arr.filter(l=>l.done), income=done.reduce((a,l)=>a+l.price,0), unpaid=done.filter(l=>!l.paid).reduce((a,l)=>a+l.price,0), mins=done.reduce((a,l)=>a+l.duration,0);
document.getElementById('income').textContent=money(income);document.getElementById('unpaid').textContent=money(unpaid);document.getElementById('completed').textContent=done.length;document.getElementById('hours').textContent=(mins/60).toFixed(1)+'h';
let upcoming=state.lessons.filter(l=>l.date>=iso(now)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,12);
dashTable.innerHTML=upcoming.length?'<table><tr><th>Date</th><th>Time</th><th>Student</th><th>Subject</th><th>Fee</th><th>Status</th></tr>'+upcoming.map(l=>`<tr><td>${l.date}</td><td>${l.time}</td><td>${l.student}</td><td>${l.subject}</td><td>${money(l.price)}</td><td><span class="badge ${l.done?'done':'pending'}">${l.done?'Completed':'Upcoming'}</span></td></tr>`).join('')+'</table>':'<div class="empty">No lessons generated yet.</div>';
}
let weekOffset=0;
function renderCalendar(){
let base=new Date();base.setDate(base.getDate()-base.getDay()+1+weekOffset*7);let end=new Date(base);end.setDate(base.getDate()+6);
weekTitle.textContent=`${iso(base)} → ${iso(end)}`;
let html='';for(let i=0;i<7;i++){let d=new Date(base);d.setDate(base.getDate()+i);let ds=iso(d), ls=state.lessons.filter(l=>l.date===ds).sort((a,b)=>a.time.localeCompare(b.time));html+=`<div class="day"><h3>${dow[d.getDay()]} · ${ds}</h3>`+(ls.map(l=>`<div class="lesson ${l.done?'donebox':''}"><strong>${l.time} · ${l.student}</strong>${l.subject}<br>${money(l.price)} ${l.done?'✓':''}</div>`).join('')||'<div class="sub">No lessons</div>')+'</div>'}calendarGrid.innerHTML=html;
}
function moveWeek(n){weekOffset+=n;renderCalendar()}
function exportCSV(){
let rows=[['Date','Time','Student','Subject','Duration','Fee','Completed','Paid'],...state.lessons.map(l=>[l.date,l.time,l.student,l.subject,l.duration,l.price,l.done?'Yes':'No',l.paid?'Yes':'No'])];
let csv=rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(',')).join('\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='teaching-schedule.csv';a.click()
}
function renderAll(){
document.getElementById('days').innerHTML=dow.slice(1).map((d,i)=>`<label style="display:inline-block;margin:6px 12px 0 0"><input type="checkbox" value="${i+1}"> ${d}</label>`).join('')+'<label style="display:inline-block;margin:6px 12px 0 0"><input type="checkbox" value="0"> Sun</label>';
let fs=document.getElementById('filterStudent');let old=fs.value;fs.innerHTML='<option value="">All students</option>'+state.students.map(s=>`<option>${s.name}</option>`).join('');fs.value=old;
renderDash();renderStudents();renderLessons();renderCalendar()
}
renderAll();
</script>
</body>
</html>
